<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="100%">
  <defs>
    <style>
      @keyframes flowDark {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .cable-base {
        stroke: #E4E4E7;
        stroke-width: 2;
        fill: none;
      }
      .cable-pulse {
        stroke: #18181B;
        stroke-width: 2;
        stroke-dasharray: 6 6;
        animation: flowDark 1.4s linear infinite;
        fill: none;
      }
      .cable-pulse-fast {
        stroke: #09090B;
        stroke-width: 2;
        stroke-dasharray: 4 4;
        animation: flowDark 0.9s linear infinite;
        fill: none;
      }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; font-size: 13px; font-weight: 600; fill: #09090B; letter-spacing: -0.2px; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; font-size: 11px; font-weight: 400; fill: #52525B; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace; font-size: 9px; font-weight: 600; fill: #52525B; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Clean Minimal Light Canvas -->
  <rect width="920" height="370" rx="14" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>

  <!-- Connecting Cables (Subtle monochrome flow) -->
  <!-- 1. Ring -> FastAPI -->
  <path d="M 185 115 C 225 115, 225 170, 265 170" class="cable-base"/>
  <path d="M 185 115 C 225 115, 225 170, 265 170" class="cable-pulse"/>

  <!-- 2. FastAPI -> AI -->
  <path d="M 445 150 C 475 150, 475 100, 505 100" class="cable-base"/>
  <path d="M 445 150 C 475 150, 475 100, 505 100" class="cable-pulse-fast"/>

  <!-- 3. FastAPI -> Firestore -->
  <path d="M 445 190 C 475 190, 475 240, 505 240" class="cable-base"/>
  <path d="M 445 190 C 475 190, 475 240, 505 240" class="cable-pulse"/>

  <!-- 4. AI -> Firestore (dashed vertical link) -->
  <path d="M 605 155 L 605 190" stroke="#D4D4D8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- 5. Firestore -> Dashboard -->
  <path d="M 685 240 C 715 240, 715 170, 745 170" class="cable-base"/>
  <path d="M 685 240 C 715 240, 715 170, 745 170" class="cable-pulse"/>

  <!-- 6. Dashboard -> Evidence Export -->
  <path d="M 685 270 C 715 270, 715 315, 745 315" class="cable-base"/>
  <path d="M 685 270 C 715 270, 715 315, 745 315" class="cable-pulse-fast"/>

  <!-- ================= CARDS (Minimalist Linear / Vercel style) ================= -->

  <!-- Card 1: Ring Hardware -->
  <g transform="translate(35, 65)">
    <rect width="150" height="100" rx="10" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="1.2"/>
    <rect x="14" y="14" width="7" height="7" rx="2" fill="#18181B"/>
    <text x="28" y="21" class="tag">01 · HARDWARE</text>
    <text x="14" y="48" class="title">Ring Camera</text>
    <text x="14" y="68" class="desc">1080p Optical Feed</text>
    <text x="14" y="84" class="desc">Motion &amp; Ring Events</text>
  </g>

  <!-- Card 2: DemaFur Core (FastAPI) -->
  <g transform="translate(265, 115)">
    <rect width="180" height="115" rx="10" fill="#FAFAFA" stroke="#18181B" stroke-width="1.4"/>
    <rect x="14" y="14" width="7" height="7" rx="2" fill="#18181B"/>
    <text x="28" y="21" class="tag">02 · CORE ENGINE</text>
    <text x="14" y="48" class="title">DemaFur API</text>
    <text x="14" y="68" class="desc">Behavioral Heuristics</text>
    <text x="14" y="84" class="desc">Trusted Pickup Windows</text>
    <text x="14" y="100" class="desc">FastAPI on Render</text>
  </g>

  <!-- Card 3: Multimodal AI -->
  <g transform="translate(505, 45)">
    <rect width="180" height="110" rx="10" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="1.2"/>
    <rect x="14" y="14" width="7" height="7" rx="2" fill="#52525B"/>
    <text x="28" y="21" class="tag">03 · AI REPORTS</text>
    <text x="14" y="48" class="title">Incident Reports</text>
    <text x="14" y="68" class="desc">Groq LLM, from event facts</text>
    <text x="14" y="84" class="desc">Bedrock supported (optional)</text>
    <text x="14" y="99" class="desc" font-size="10" fill="#71717A">Zero-Identity Reasoning</text>
  </g>

  <!-- Card 4: Firebase Firestore -->
  <g transform="translate(505, 190)">
    <rect width="180" height="105" rx="10" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="1.2"/>
    <rect x="14" y="14" width="7" height="7" rx="2" fill="#52525B"/>
    <text x="28" y="21" class="tag">04 · PERSISTENCE</text>
    <text x="14" y="48" class="title">Firebase Firestore</text>
    <text x="14" y="68" class="desc">Delivery Timelines</text>
    <text x="14" y="84" class="desc">Audit Logs &amp; Events</text>
    <text x="14" y="99" class="desc" font-size="10" fill="#71717A">In-Memory Sort Indexing</text>
  </g>

  <!-- Card 5: Next.js UI -->
  <g transform="translate(745, 115)">
    <rect width="145" height="115" rx="10" fill="#FAFAFA" stroke="#18181B" stroke-width="1.4"/>
    <rect x="14" y="14" width="7" height="7" rx="2" fill="#18181B"/>
    <text x="28" y="21" class="tag">05 · CLIENT</text>
    <text x="14" y="48" class="title">Next.js 16 UI</text>
    <text x="14" y="68" class="desc">Owner Decision Hub</text>
    <text x="14" y="84" class="desc">CCTV HUD Overlays</text>
    <text x="14" y="100" class="desc">Vercel Deployment</text>
  </g>

  <!-- Card 6: Evidence Bundle -->
  <g transform="translate(745, 275)">
    <rect width="145" height="70" rx="8" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="1"/>
    <text x="12" y="25" class="title" font-size="11">Evidence Export</text>
    <text x="12" y="43" class="desc" font-size="10">SHA-256 Manifest</text>
    <text x="12" y="57" class="desc" font-size="10">Forensic Clip ZIP</text>
  </g>

</svg>
