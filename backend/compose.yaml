services:
  api:
    build: .
    env_file: .env
    environment:
      DEMAFUR_DB: /data/demafur.sqlite3
      DEMAFUR_MEDIA_DIR: /data/media
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - demafur-data:/data
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      DEMAFUR_API_KEY: ${DEMAFUR_API_KEY:?Set DEMAFUR_API_KEY in .env}
      DEMAFUR_URL: http://api:8000
      DEMAFUR_WORKER_INTERVAL_SECONDS: "15"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  demafur-data:
