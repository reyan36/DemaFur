[project]
name = "demafur-backend"
version = "0.3.0"
description = "Privacy-first delivery safety and incident-response API"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "httpx==0.28.1", "psycopg[binary]>=3.2,<4", "boto3>=1.40,<2"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["demafur*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
demafur = ["static/*", "migrations/*.sql"]
